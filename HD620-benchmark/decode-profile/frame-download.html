<style>
#hd620-frame-download { display:grid; gap:calc(var(--font-size-base, 14px) * .7); color:var(--foreground, CanvasText); }
#hd620-frame-download section { display:grid; gap:4px; min-width:0; }
#hd620-frame-download .measure { display:grid; grid-template-columns:8.4em minmax(0, 1fr) 5.5ch; gap:8px; align-items:center; }
#hd620-frame-download .track { height:.65em; background:var(--muted, #8882); }
#hd620-frame-download .mark { display:block; height:100%; background:var(--viz-series-1, var(--chart-1, currentColor)); }
#hd620-frame-download .download { background:var(--viz-series-2, var(--chart-2, currentColor)); }
</style>
<div id="hd620-frame-download" role="group" aria-label="Median decode throughput on the Intel HD 620 by frame output path, in frames per second">
  <h2>HD 620 decode throughput (median fps)</h2>
  <section aria-label="H.264 1080p">
    <h3>H.264 1080p</h3>
    <div class="measure"><span>GPU-resident</span><span class="track" aria-hidden="true"><span class="mark" style="width:92.08%"></span></span><span class="tabular-nums">644.6</span></div>
    <div class="measure"><span>CPU download</span><span class="track" aria-hidden="true"><span class="mark download" style="width:70.80%"></span></span><span class="tabular-nums">495.6</span></div>
  </section>
  <section aria-label="VP9 10-bit 720p">
    <h3>VP9 10-bit 720p</h3>
    <div class="measure"><span>GPU-resident</span><span class="track" aria-hidden="true"><span class="mark" style="width:95.68%"></span></span><span class="tabular-nums">669.8</span></div>
    <div class="measure"><span>CPU download</span><span class="track" aria-hidden="true"><span class="mark download" style="width:69.37%"></span></span><span class="tabular-nums">485.6</span></div>
  </section>
</div>
